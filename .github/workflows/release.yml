name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake g++ nlohmann-json3-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Package binary
        run: |
          mkdir -p dist
          cp build/org dist/org
          tar -czf "organise-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz" -C dist org

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: organise-${{ steps.version.outputs.version }}-x86_64-linux.tar.gz
          generate_release_notes: true

  aur-publish:
    needs: build-and-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump PKGBUILD version
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ needs.build-and-release.outputs.version }}/" packaging/stable/PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" packaging/stable/PKGBUILD

      - name: Publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.1
        with:
          pkgname: organise
          pkgbuild: ./packaging/stable/PKGBUILD
          updpkgsums: true
          test: true
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to ${{ needs.build-and-release.outputs.version }}"
